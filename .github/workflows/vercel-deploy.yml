name: Trigger Vercel Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Trigger Vercel Deployment
        run: |
          echo "🚀 Triggering Vercel deployment..."
          # Use Vercel API to trigger deployment
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/${VERCEL_PROJECT_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"gitSource":{"type":"github","repo":"AproposCreative/apropos-research","ref":"main"}}' || \
          echo "⚠️ Vercel API call failed - using alternative method"
          
          # Alternative: Use Vercel CLI if available
          if command -v vercel &> /dev/null; then
            vercel --prod --yes --token ${VERCEL_TOKEN} || echo "⚠️ Vercel CLI deployment failed"
          else
            echo "ℹ️ Vercel CLI not available - deployment will be triggered by webhook"
          fi

