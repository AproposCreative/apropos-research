name: Trigger Vercel Deployment

on:
  push:
    branches: [ main ]
    paths:
      # Only trigger on code changes, not on data file changes
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    # Only run if Vercel secrets are configured
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Trigger Vercel Deployment via API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🚀 Triggering Vercel deployment..."
          
          # Use Vercel API v13 to trigger deployment
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"apropos-research\",
              \"project\": \"${VERCEL_PROJECT_ID}\",
              \"target\": \"production\",
              \"gitSource\": {
                \"type\": \"github\",
                \"repo\": \"AproposCreative/apropos-research\",
                \"ref\": \"main\"
              }
            }")
          
          if echo "$RESPONSE" | grep -q '"id"'; then
            DEPLOYMENT_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*' | cut -d'"' -f4)
            echo "✅ Vercel deployment triggered successfully!"
            echo "📋 Deployment ID: $DEPLOYMENT_ID"
            echo "🔗 View deployment: https://vercel.com/dashboard"
          else
            echo "⚠️ Vercel API call failed. Response: $RESPONSE"
            echo "ℹ️ This is OK if Vercel GitHub integration is configured - webhook will handle it"
            exit 0  # Don't fail the workflow
          fi

