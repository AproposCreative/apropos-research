name: Daily Article Ingestion

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC (before embeddings training at 03:00)

jobs:
  ingest-articles:
    runs-on: ubuntu-latest
    env:
      # Default values (we now use dynamic media sources from media-sources.json, so these are just fallbacks)
      # 
      # ⚠️ LINTER WARNINGS: "Context access might be invalid" warnings below are FALSE POSITIVES.
      # These secrets are OPTIONAL - we provide fallback values using the || operator.
      # The workflow works correctly even if secrets are not set in GitHub.
      # You can safely ignore these warnings - they do not affect workflow execution.
      #
      RAGE_BASE_URL: ${{ secrets.RAGE_BASE_URL || 'https://soundvenue.com' }}
      RAGE_FEED_PATH: ${{ secrets.RAGE_FEED_PATH || '/feed' }}
      RAGE_SITEMAP_INDEX: ${{ secrets.RAGE_SITEMAP_INDEX || '/sitemap.xml' }}
      RAGE_RATE_LIMIT_RPS: ${{ secrets.RAGE_RATE_LIMIT_RPS || '1' }}
      RAGE_STORAGE_DIR: ${{ secrets.RAGE_STORAGE_DIR || './data' }}
      RAGE_USER_AGENT: ${{ secrets.RAGE_USER_AGENT || 'OnkelRageknivBot/1.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Display RAGE environment variables
        run: |
          echo "📋 RAGE environment variables (using dynamic media sources from media-sources.json):"
          echo "  RAGE_BASE_URL: $RAGE_BASE_URL"
          echo "  RAGE_FEED_PATH: $RAGE_FEED_PATH"
          echo "  RAGE_SITEMAP_INDEX: $RAGE_SITEMAP_INDEX"
          echo "  RAGE_RATE_LIMIT_RPS: $RAGE_RATE_LIMIT_RPS"
          echo "  RAGE_STORAGE_DIR: $RAGE_STORAGE_DIR"
          echo "  RAGE_USER_AGENT: $RAGE_USER_AGENT"
          echo "✅ Environment variables are set (secrets are optional, defaults used if not set)"

      - name: Ingest recent articles
        run: |
          echo "🔄 Starting daily article ingestion..."
          npm run ingest:rage -- --since=24 --limit=100
          echo "✅ Article ingestion completed"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            git commit -m "📰 Daily article ingestion - $(date +'%Y-%m-%d')"
            git push
            echo "✅ New articles committed and pushed"
          fi
