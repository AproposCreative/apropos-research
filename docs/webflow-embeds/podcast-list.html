<!--
  Webflow Embed — paste on a static /podcasts page.
  Create the page in Designer if it does not exist yet.
  Style list items in Designer; keep data attributes.
-->
<section data-apropos-podcast-list data-limit="20" style="max-width:42rem;margin:0 auto;padding:2rem 1.25rem;">
  <article
    data-apropos-podcast-item
    hidden
    style="display:grid;gap:0.35rem;padding:1rem 0;border-bottom:1px solid rgba(0,0,0,.12);"
  >
    <h3 data-apropos-podcast-item-title style="margin:0;font-size:1.125rem;line-height:1.3;">Titel</h3>
    <p data-apropos-podcast-item-hosts style="margin:0;opacity:.65;font-size:0.9rem;">Hosts</p>
    <time data-apropos-podcast-item-date style="opacity:.5;font-size:0.8rem;"></time>
    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem;">
      <button type="button" data-apropos-podcast-item-play style="min-height:44px;padding:0.5rem 0.9rem;font:inherit;cursor:pointer;">
        Afspil
      </button>
      <a data-apropos-podcast-item-link href="#" style="min-height:44px;display:inline-flex;align-items:center;padding:0.5rem 0.9rem;">
        Læs artiklen
      </a>
    </div>
  </article>
</section>
