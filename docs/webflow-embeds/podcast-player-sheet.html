<!--
  Fallback embed — prefer the native component "Apropos Podcast Player".
  Single-line pill bar: speed · −15 · play/pause · +30 · meta/progress · mute · volume.
  AirPlay / queue / transcript are omitted — no reliable web equivalents.
-->
<style>
  .audio-player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9990;
    display: flex; justify-content: center; padding: 10px 20px 16px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translate3d(0, 36px, 0);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1), visibility 0s linear .7s;
  }
  .audio-player.is-open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translate3d(0, 0, 0);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1), visibility 0s linear 0s;
  }
  .audio-player__card {
    width: 100%; max-width: 1120px; min-height: 64px;
    display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 18px;
    padding: 10px 16px; border-radius: 32px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(40px) saturate(180%);
    border: .5px solid rgba(255,255,255,.65); box-shadow: 0 10px 40px rgba(0,0,0,.12);
    color: rgba(0,0,0,.92); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  .audio-player__controls, .audio-player__cluster { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .audio-player__cluster { gap: 4px; }
  .audio-player__volume-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .audio-player__meta { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; max-width: 480px; }
  .audio-player__meta-text { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .audio-player__title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .audio-player__artwork { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: rgba(255,255,255,.06); flex-shrink: 0; }
  .audio-player__title { margin: 0; font-size: 13px; font-weight: 600; color: rgba(0,0,0,.92); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .audio-player__hosts { margin: 0; font-size: 12px; color: rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .audio-player__timeline { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 2px; }
  .audio-player__time { margin: 0; min-width: 32px; flex-shrink: 0; font-size: 11px; line-height: 1; color: rgba(0,0,0,.45); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .audio-player__time-end { text-align: right; }
  .audio-player__progress { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; width: 100%; height: 3px; margin: 0; border-radius: 16px; background: rgba(0,0,0,.12); cursor: pointer; accent-color: #111; }
  .audio-player__volume { -webkit-appearance: none; appearance: none; width: 72px; height: 4px; margin: 0; border-radius: 16px; background: rgba(0,0,0,.12); cursor: pointer; accent-color: #111; }
  .audio-player__speed, .audio-player__icon-btn, .audio-player__play, .audio-player__close {
    display: flex; align-items: center; justify-content: center; text-decoration: none; color: rgba(0,0,0,.88); cursor: pointer;
  }
  .audio-player__icon, .audio-player__icon-play, .audio-player__icon-pause { filter: brightness(0); }
  .audio-player__speed { min-width: 36px; height: 36px; font-size: 14px; font-weight: 600; }
  .audio-player__icon-btn { width: 36px; height: 36px; }
  .audio-player__play { width: 40px; height: 40px; }
  .audio-player__close { width: 28px; height: 28px; opacity: .85; flex-shrink: 0; }
  .audio-player__icon { width: 18px; height: 18px; display: block; object-fit: contain; }
  .audio-player__icon-play { width: 18px; height: 20px; display: block; }
  .audio-player__icon-pause { width: 16px; height: 18px; display: none; }
  .audio-player.is-playing .audio-player__icon-play { display: none; }
  .audio-player.is-playing .audio-player__icon-pause { display: block; }
</style>
<div class="audio-player" data-apropos-podcast-player hidden aria-hidden="true">
  <div class="audio-player__card">
    <div class="audio-player__controls">
      <a class="audio-player__speed" href="#" data-apropos-podcast-speed aria-label="Skift afspilningshastighed">1x</a>
      <a class="audio-player__icon-btn" href="#" data-apropos-podcast-skip-back aria-label="Spol 15 sekunder tilbage">
        <img class="audio-player__icon" src="https://ai.aproposmagazine.com/podcast-icons/gobackward-15.svg" alt="" />
      </a>
      <a class="audio-player__play" href="#" data-apropos-podcast-play aria-label="Afspil">
        <img class="audio-player__icon-play" src="https://ai.aproposmagazine.com/podcast-icons/play-fill.svg" alt="" />
        <img class="audio-player__icon-pause" src="https://ai.aproposmagazine.com/podcast-icons/pause-fill.svg" alt="" />
      </a>
      <a class="audio-player__icon-btn" href="#" data-apropos-podcast-skip-forward aria-label="Spol 30 sekunder frem">
        <img class="audio-player__icon" src="https://ai.aproposmagazine.com/podcast-icons/goforward-30.svg" alt="" />
      </a>
    </div>
    <div class="audio-player__meta">
      <img class="audio-player__artwork" data-apropos-podcast-artwork alt="" />
      <div class="audio-player__meta-text">
        <div class="audio-player__title-row">
          <div class="audio-player__title-mask">
            <p class="audio-player__title" data-apropos-podcast-title>Artikeltitel</p>
          </div>
          <a class="audio-player__close" href="#" data-apropos-podcast-close aria-label="Luk afspiller">×</a>
        </div>
        <p class="audio-player__hosts" data-apropos-podcast-hosts>Apropos Magazine</p>
        <div class="audio-player__timeline">
          <p class="audio-player__time" data-apropos-podcast-current-time>0:00</p>
          <input class="audio-player__progress" type="range" data-apropos-podcast-progress min="0" max="1000" value="0" aria-label="Position i lyden" />
          <p class="audio-player__time audio-player__time-end" data-apropos-podcast-duration>0:00</p>
        </div>
      </div>
    </div>
    <div class="audio-player__cluster">
      <a class="audio-player__icon-btn" href="#" data-apropos-podcast-mute aria-label="Slå lyd fra">
        <img class="audio-player__icon" src="https://cdn.prod.website-files.com/67dbf17ba540975b5b21c180/6a79affdbf9530ed1ee1ad72_speaker-wave.svg" alt="" />
      </a>
      <div class="audio-player__volume-wrap">
        <input class="audio-player__volume" type="range" data-apropos-podcast-volume min="0" max="100" value="100" aria-label="Lydstyrke" />
      </div>
    </div>
  </div>
</div>
